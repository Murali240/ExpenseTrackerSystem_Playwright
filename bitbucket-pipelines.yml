# Keep in sync with package.json @playwright/test major.minor
image: mcr.microsoft.com/playwright:v1.57.0-jammy

options:
  size: 2x
  max-time: 60

definitions:
  caches:
    node: ~/.npm

  steps:
    - step: &install
        name: 📦 Install Dependencies
        caches:
          - node
        script:
          - npm ci
          - npx playwright install --with-deps

    - step: &notify-slack
        name: 📢 Notify Slack
        script:
          - |
            if [ "$BITBUCKET_BUILD_STATUS" = "SUCCESSFUL" ]; then
              STATUS="✅ SUCCESS"
            else
              STATUS="❌ FAILED"
            fi

            curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$STATUS - Repo: $BITBUCKET_REPO_FULL_NAME | Branch: $BITBUCKET_BRANCH\"}" \
            $SLACK_WEBHOOK_URL

pipelines:

  pull-requests:
    '**':
      - parallel:
          - step:
              <<: *install
              name: 🧪 PR - Chromium
              script:
                - npm ci
                - npx playwright test --project=chromium --retries=1
          - step:
              <<: *install
              name: 🧪 PR - Firefox
              script:
                - npm ci
                - npx playwright test --project=firefox --retries=1
          - step:
              <<: *install
              name: 🧪 PR - WebKit
              script:
                - npm ci
                - npx playwright test --project=webkit --retries=1
      - step: *notify-slack

  branches:
    main:
      - parallel:
          - step:
              <<: *install
              name: 🚀 Main - Chromium
              script:
                - npm ci
                - npx playwright test --project=chromium
          - step:
              <<: *install
              name: 🚀 Main - Firefox
              script:
                - npm ci
                - npx playwright test --project=firefox
          - step:
              <<: *install
              name: 🚀 Main - WebKit
              script:
                - npm ci
                - npx playwright test --project=webkit
      - step: *notify-slack

  custom:
    nightly-regression:
      - parallel:
          - step:
              <<: *install
              name: 🌙 Nightly - Chromium
              script:
                - npm ci
                - npx playwright test --project=chromium
          - step:
              <<: *install
              name: 🌙 Nightly - Firefox
              script:
                - npm ci
                - npx playwright test --project=firefox
          - step:
              <<: *install
              name: 🌙 Nightly - WebKit
              script:
                - npm ci
                - npx playwright test --project=webkit
      - step: *notify-slack

    run-qa:
      - step:
          <<: *install
          name: 🚀 Run Tests on QA
          script:
            - npm ci
            - npx playwright test
      - step: *notify-slack

    run-uat:
      - step:
          <<: *install
          name: 🚀 Run Tests on UAT
          script:
            - npm ci
            - npx playwright test
      - step: *notify-slack